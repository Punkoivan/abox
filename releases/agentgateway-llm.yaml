# Standalone agentgateway for LLM providers, model routes, policies and MCP
# targets, edited through its own admin UI. The controller-managed
# agentgateway-external proxy gets its config over xDS from CRDs, so its UI is
# read-only; this one runs from a local file, and a save in the UI writes the
# file and hot-reloads it.
#
# The file lives on a PVC. The seed ConfigMap is copied only when the file is
# missing, so Flux never overwrites what was saved in the UI -- bumping this
# seed alone does not reach an already-seeded pod; the PVC has to be deleted
# (and the pod restarted) to force a reseed.
#
# The admin port (15000) has no auth and can rewrite the config, including
# provider keys. Reach it with port-forward only; never route it:
#   kubectl -n agentgateway-system port-forward svc/agentgateway-llm 15000
#   open http://localhost:15000/ui
#
# LLM traffic: http://agentgateway-llm.agentgateway-system.svc.cluster.local
# (Service port 80 -> gateways.default on 8080, OpenAI-compatible paths, e.g.
# POST /v1/chat/completions with `Authorization: Bearer <TRIAGE_LLM_KEY>`).
# `gateways: default: {port: 8080}` replaces the old `binds: []` stub --
# `binds` is the deprecated raw-config field; the simplified `llm:` section
# below attaches to the gateway named "default" implicitly, and omitting a
# `gateways:` block entirely (as this file did before) leaves agentgateway's
# own built-in default of port 4000, not this Service's 8080.
#
# config.database is what the Costs/Analytics/Logs pages in the UI need --
# without it those pages have nothing to read and stay empty, which is why a
# fresh install shows a short menu with whole LLM sections looking hidden.
# SQLite on the same PVC the config file already lives on, so no second
# volume.
#
# Gemini 2.5 Flash text only -- Gemini's native-audio Live API is a stateful
# WebSocket protocol agentgateway has no backend type for (it proxies exactly
# one realtime WS protocol today, OpenAI Realtime; there is no Gemini-Live
# equivalent), so voice bypasses this gateway entirely and goes straight from
# triage-core to Gemini. GEMINI_API_KEY is a container env var (Secret, out of
# band, same convention as every other credential in this repo):
#
#   kubectl -n agentgateway-system create secret generic agentgateway-llm-secrets \
#     --from-literal=GEMINI_API_KEY=<gemini api key> \
#     --from-literal=TRIAGE_LLM_KEY=<random bearer token for the triage virtual key>
#
# llm.policies.apiKey.mode: strict means every LLM request needs
# `Authorization: Bearer <TRIAGE_LLM_KEY>` -- that Bearer token IS the
# "triage" tenant identity ag-llm's budget/allowedModels/metrics all key off,
# so it is never written into this file in plaintext (unlike GEMINI_API_KEY,
# it isn't a provider secret agentgateway calls out with -- it is the
# credential callers present TO this gateway, so it has to be a real value a
# caller can be given, not something agentgateway resolves itself; the only
# way to keep it out of git is the same $ENV substitution agentgateway
# already does for params.apiKey).
#
# config.modelCatalog prices gemini-2.5-flash (USD per 1M tokens, checked
# against ai.google.dev/gemini-api/docs/pricing -- $0.30 in / $2.50 out /
# $0.03 cached-read / $1.00 audio-in) so the USD budget below and the
# Costs/Analytics pages have real numbers instead of token counts alone.
# `gcp.gemini` is the catalog's provider id for the Gemini API, not a values
# choice -- see agentgateway's own worked example under Model costs.
#
# frontendPolicies.tracing sends every request/response span (HTTP + LLM,
# OpenTelemetry gen-ai semconv) to Phoenix's OTLP gRPC receiver in-cluster --
# plaintext, no auth, matching how phoenix-svc is otherwise only reachable
# from inside the cluster. This traces ag-llm's own proxy hop; it says
# nothing about whether triage-core's own LLM calls reach Phoenix (they
# don't yet -- see releases/triage-core.yaml's otelTracing block).
# triage-core routes through this gateway: releases/triage-core.yaml sets
# runtimeConfig.models.main.baseURL here and names the Secret holding
# TRIAGE_LLM_KEY in models.main.apiKeySecretRef.
#
# llm.policies.guardrails is regex-only: built-in PII detectors (mask, so a
# false positive degrades rather than breaks the request) plus the same
# injection/jailbreak phrase list triage-core's own event guardrail already
# checks (internal/core/guardrail.go's roleHijackPatterns et al, ported here
# as a second, independent layer against LLM traffic specifically -- reject,
# not mask, since there is no safe redaction of a whole hijack attempt).
# Needs no external service/credentials beyond what is already here, unlike
# openAIModeration/bedrockGuardrails/googleModelArmor.
#
# The triage-daily-spend budget ($5/day) is a starting guardrail, not a
# measured number -- raise it in the UI (LLM > Virtual API Keys) or here if
# it is too tight.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-llm-seed
  namespace: agentgateway-system
data:
  config.yaml: |
    config:
      adminAddr: 0.0.0.0:15000
      database:
        url: "sqlite:///config/agentgateway.db?mode=rwc"
      modelCatalog:
      - inline:
          providers:
            gcp.gemini:
              models:
                gemini-2.5-flash:
                  rates:
                    input: "0.30"
                    output: "2.50"
                    cacheRead: "0.03"
                    inputAudio: "1.00"

    gateways:
      default:
        port: 8080

    frontendPolicies:
      tracing:
        host: phoenix-svc.phoenix.svc.cluster.local:4317
        randomSampling: true

    llm:
      policies:
        apiKey:
          mode: strict
          keys:
          - key: "$TRIAGE_LLM_KEY"
            metadata:
              name: triage
            allowedModels:
            - gemini-2.5-flash
            budgets:
            - name: triage-daily-spend
              limit:
                unit: USD
                amount: 5
              window:
                rolling: 24h
              onBudgetExceeded: Block
        guardrails:
          request:
          - regex:
              action: mask
              rules:
              - builtin: creditCard
              - builtin: ssn
              - builtin: email
              - builtin: phoneNumber
          - regex:
              action: reject
              rules:
              - pattern: '(?i)ignore\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)ignore\s+(all\s+|any\s+)?prior\s+instructions'
              - pattern: '(?i)disregard\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)forget\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)you\s+are\s+now\s+(a|an|my)\s+'
              - pattern: '(?i)new\s+instructions\s*:'
              - pattern: '(?i)system\s*:\s*you\s+are'
              - pattern: '(?i)act\s+as\s+if\s+you'
              - pattern: '(?i)DAN\s+mode'
              - pattern: '(?i)developer\s+mode'
              - pattern: '(?i)do\s+anything\s+now'
              - pattern: '(?i)jailbreak'
      models:
      - name: gemini-2.5-flash
        provider: gemini
        params:
          model: gemini-2.5-flash
          apiKey: "$GEMINI_API_KEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgateway-llm-config
  namespace: agentgateway-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-llm
  namespace: agentgateway-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentgateway-llm
  template:
    metadata:
      labels:
        app: agentgateway-llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c", "[ -s /config/config.yaml ] || cp /seed/config.yaml /config/config.yaml"]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: seed, mountPath: /seed}
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          args: ["-f", "/config/config.yaml"]
          ports:
            - {name: llm, containerPort: 8080}
            - {name: admin, containerPort: 15000}
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-llm-secrets
                  key: GEMINI_API_KEY
            - name: TRIAGE_LLM_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-llm-secrets
                  key: TRIAGE_LLM_KEY
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: agentgateway-llm-config
        - name: seed
          configMap:
            name: agentgateway-llm-seed
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-llm
  namespace: agentgateway-system
spec:
  selector:
    app: agentgateway-llm
  ports:
    - {name: llm, port: 80, targetPort: llm}
    - {name: admin, port: 15000, targetPort: admin}
