# Standalone agentgateway for LLM providers, model routes, policies and MCP
# targets, edited through its own admin UI. The controller-managed
# agentgateway-external proxy gets its config over xDS from CRDs, so its UI is
# read-only; this one runs from a local file, and a save in the UI writes the
# file and hot-reloads it.
#
# The file lives on a PVC, seeded from the ConfigMap below by an init
# container: on an empty claim, and again whenever the seed in git changes
# (tracked by its md5 on the claim). A UI save survives restarts, but the next
# seed change in git replaces it.
#
# The admin port (15000) has no auth and can rewrite the config, including
# provider keys. Reach it with port-forward only; never route it:
#   kubectl -n agentgateway-system port-forward svc/agentgateway-llm 15000
#   open http://localhost:15000/ui
#
# LLM traffic: http://agentgateway-llm.agentgateway-system.svc.cluster.local
# (Service port 80 -> gateways.default on 8080, OpenAI-compatible paths, e.g.
# POST /v1/chat/completions with `Authorization: Bearer <KAGENT_LLM_KEY>`).
# `gateways: default: {port: 8080}` is what the `llm:` section attaches to;
# without it agentgateway listens on its built-in 4000, not this Service's 8080.
#
# config.database backs the Costs/Analytics/Logs pages in the UI (SQLite on the
# same PVC).
#
# Upstream: the in-cluster Qwen3-4B (releases/llama-cpp-chat.yaml) -- there is
# no hosted-LLM key in this fork. Callers: kagent's default-model-config
# (releases/kagent.yaml), i.e. every declarative agent.
#
# llm.policies.apiKey.mode: strict -- every request needs the "kagent" virtual
# key. It is the identity allowedModels/metrics key off, so it comes from the
# environment ($KAGENT_LLM_KEY, SOPS Secret agentgateway-llm-secrets), never
# from this file. The same value sits in kagent/kagent-llm-key for the caller;
# scripts/seal-secrets.sh llm writes both.
#
# frontendPolicies.tracing sends every request/response span (HTTP + LLM,
# OpenTelemetry gen-ai semconv) to Phoenix's OTLP gRPC receiver in-cluster.
#
# llm.policies.guardrails is regex-only: built-in PII detectors (mask) plus a
# prompt-injection/jailbreak phrase list (reject). No external service needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-llm-seed
  namespace: agentgateway-system
data:
  config.yaml: |
    config:
      adminAddr: 0.0.0.0:15000
      database:
        url: "sqlite:///config/agentgateway.db?mode=rwc"
      modelCatalog:
      - inline:
          providers:
            openai:
              models:
                # Local model: no per-token cost, listed so cost/usage
                # telemetry resolves to a known model instead of "unknown".
                qwen3-4b-instruct:
                  rates:
                    input: "0"
                    output: "0"

    gateways:
      default:
        port: 8080

    frontendPolicies:
      tracing:
        host: phoenix-svc.phoenix.svc.cluster.local:4317
        randomSampling: true

    llm:
      policies:
        apiKey:
          mode: strict
          keys:
          - key: "$KAGENT_LLM_KEY"
            metadata:
              name: kagent
            allowedModels:
            - qwen3-4b-instruct
        guardrails:
          request:
          - regex:
              action: mask
              rules:
              - builtin: creditCard
              - builtin: ssn
              - builtin: email
              - builtin: phoneNumber
          - regex:
              action: reject
              rules:
              - pattern: '(?i)ignore\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)ignore\s+(all\s+|any\s+)?prior\s+instructions'
              - pattern: '(?i)disregard\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)forget\s+(all\s+|any\s+)?previous\s+instructions'
              - pattern: '(?i)you\s+are\s+now\s+(a|an|my)\s+'
              - pattern: '(?i)new\s+instructions\s*:'
              - pattern: '(?i)system\s*:\s*you\s+are'
              - pattern: '(?i)act\s+as\s+if\s+you'
              - pattern: '(?i)DAN\s+mode'
              - pattern: '(?i)developer\s+mode'
              - pattern: '(?i)do\s+anything\s+now'
              - pattern: '(?i)jailbreak'
      models:
      - name: qwen3-4b-instruct
        provider: openAI
        params:
          model: qwen3-4b-instruct
          baseUrl: http://llama-cpp-chat.llama-cpp.svc.cluster.local:8082/v1
          # llama-server checks no key; set so nothing is picked up from env.
          apiKey: "unused"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgateway-llm-config
  namespace: agentgateway-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-llm
  namespace: agentgateway-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentgateway-llm
  template:
    metadata:
      labels:
        app: agentgateway-llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: seed
          image: busybox:1.36
          # Re-seed when the seed in git changes, not only on an empty claim:
          # "copy once" left a changed ConfigMap silently unapplied behind the
          # first config ever written. UI edits survive until the next seed
          # change -- git wins then.
          command:
            - sh
            - -c
            - |
              new=$(md5sum /seed/config.yaml | cut -d' ' -f1)
              if [ ! -s /config/config.yaml ] || [ "$(cat /config/.seed-md5 2>/dev/null)" != "$new" ]; then
                cp /seed/config.yaml /config/config.yaml && echo "$new" > /config/.seed-md5
              fi
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: seed, mountPath: /seed}
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          args: ["-f", "/config/config.yaml"]
          ports:
            - {name: llm, containerPort: 8080}
            - {name: admin, containerPort: 15000}
          env:
            - name: KAGENT_LLM_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-llm-secrets
                  key: KAGENT_LLM_KEY
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: agentgateway-llm-config
        - name: seed
          configMap:
            name: agentgateway-llm-seed
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-llm
  namespace: agentgateway-system
spec:
  selector:
    app: agentgateway-llm
  ports:
    - {name: llm, port: 80, targetPort: llm}
    - {name: admin, port: 15000, targetPort: admin}
