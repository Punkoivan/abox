# otel-demo's prebuilt service graph, as a Flux-native OCI artifact (the same
# tar+gzip format this repo's own releases/ artifact uses, built and pushed
# with `flux push artifact` outside this repo) -- unpacked, it's one manifest:
# a MemoryCell (xray.ai/v1) with the tenant's graph.gob.gz bytes inlined at
# spec.data.graph, exactly what `make apply-graph-cell TENANT=otel-demo`
# would emit in the triage-core source repo. No values.yaml key for this in
# the chart -- graphs are delivered out of Helm, per its own docs.
#
# secretRef reuses triage-ghcr-pull since this OCIRepository lives in the
# triage namespace (unlike triage-core/triage-agent's, which live in
# flux-system and need the separate ghcr-credentials Secret there).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: graph-otel-demo
  namespace: triage
spec:
  interval: 10m
  url: oci://ghcr.io/den-vasyliev/abox/graphs/otel-demo
  ref:
    tag: latest
  secretRef:
    name: triage-ghcr-pull
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: graph-otel-demo
  namespace: triage
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: graph-otel-demo
  path: ./
  prune: false
  # No dependsOn on flux-system/releases: this repo has one flat Kustomization
  # (flux-system/releases, path ./) applying every releases/*.yaml, and since
  # THIS object is itself one of the things releases applies, releases
  # (wait: true) health-checks it as part of its own readiness -- a
  # dependsOn back onto releases would deadlock both sides waiting on each
  # other (confirmed live: releases stuck retrying every 30s citing this
  # Kustomization 'InProgress', while this one reported releases 'not
  # ready'). The MemoryCell CRD (xray.ai_memorycells.yaml) ships in
  # triage-core's chart crds/ dir and is installed by Helm on that chart's
  # install; a failed attempt before the CRD exists just retries every
  # interval until it does (ADR-033: re-applying the same blob is a no-op,
  # so there's no harm reconciling early and often).
