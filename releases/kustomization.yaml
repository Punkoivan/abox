apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets
  - agentgateway.yaml
  - agentgateway-llm.yaml
  - agentregistry.yaml
  - agent-retrieval.yaml
  - kagent.yaml
  - llama-cpp-chat.yaml
  - llama-cpp-embeddings.yaml
  - llmd.yaml
  - mcp-servers.yaml
  - mlflow.yaml
  - mlflow-experiments.yaml
  - mlflow-otel-collector.yaml
  - neo4j.yaml
  - opentelemetry-demo.yaml
  - phoenix.yaml
  - qdrant.yaml

# First boot pulls every image at once; on a laptop-sized KinD that pushes
# several installs (kagent, mlflow, phoenix, opentelemetry-demo) past
# helm-controller's 5m default, and a failed install with no remediation just
# sits until the next 1h interval. Give every release room and retries.
# No release sets these itself; this strategic merge would override one that
# did, so set per-release values here instead if one ever needs to differ.
patches:
  - target:
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: any
      spec:
        timeout: 15m
        install:
          remediation:
            retries: 3
