# Bridges triage-core's OTel traces into MLflow Tracing. triage-core's own
# exporter only speaks OTLP/gRPC (releases/triage-core.yaml's otelTracing
# comment: "grpc is the only protocol the exporter build supports"), and
# MLflow's tracking server only accepts OTLP/HTTP at POST /v1/traces -- gRPC
# ingestion isn't implemented (confirmed against mlflow.org/docs/latest/genai/
# tracing/opentelemetry/ingest/, 2026-09-21). Pointing triage-core straight at
# mlflow-mlflow:5000 is therefore a dead end; this collector receives gRPC on
# :4317 (same protocol/port triage-core already targets on phoenix-svc) and
# re-exports over OTLP/HTTP with the x-mlflow-experiment-id header MLflow
# requires to route spans into an experiment. "0" is the auto-created Default
# experiment -- no dedicated experiment exists yet.
#
# Reuses the open-telemetry HelmRepository releases/opentelemetry-demo.yaml
# already declares in flux-system rather than redeclaring it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: mlflow
spec:
  interval: 1h
  releaseName: otel-collector
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.173.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    mode: deployment
    fullnameOverride: otel-collector
    # The chart dropped its implicit image default in this version -- must be
    # explicit or the render fails outright.
    image:
      repository: otel/opentelemetry-collector-contrib
    # Jaeger/Zipkin ingestion ports are chart defaults, enabled regardless of
    # whether those receivers exist in config. Disabled to match the trimmed
    # receiver set below instead of listening on dead ports.
    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    config:
      exporters:
        # otlp_http, not otlphttp -- the chart's rewriteDeprecatedComponentNames
        # (on by default) silently renames the old identifier at render time;
        # writing the current one directly skips that rewrite and its warning.
        otlp_http/mlflow:
          endpoint: http://mlflow-mlflow.mlflow.svc.cluster.local:5000
          tls:
            insecure: true
          headers:
            x-mlflow-experiment-id: "0"
      # jaeger/zipkin removed outright, not just dropped from the traces
      # pipeline below -- the collector refuses to start with a receiver
      # defined but not referenced by any pipeline.
      receivers:
        jaeger: null
        zipkin: null
      service:
        pipelines:
          traces:
            receivers:
              - otlp
            exporters:
              # debug logs each received span to the pod's stdout -- useful to
              # confirm triage-core traces are arriving before checking MLflow.
              - debug
              - otlp_http/mlflow
