apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mlflow
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/mlflow/charts/mlflow
  ref:
    tag: "0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: mlflow
spec:
  interval: 1h
  releaseName: mlflow
  chartRef:
    kind: OCIRepository
    name: mlflow
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # No external Postgres or object store in this sandbox: SQLite backend
    # store and server-proxied artifacts both land on one PVC. The chart
    # requires backendStoreUri (or backendStoreUriFrom) or the Deployment
    # template fails the render outright.
    storage:
      enabled: true
    mlflow:
      backendStoreUri: "sqlite:////mlflow/mlflow.db"
      # serve_artifacts (below) proxies uploads/downloads through the
      # tracking server instead of clients writing straight to a path, so
      # defaultArtifactRoot points at the proxy scheme rather than a real URI.
      defaultArtifactRoot: "mlflow-artifacts:/"
      artifactsDestination: "/mlflow/artifacts"
    server:
      flag_options:
        - serve_artifacts
      # DNS-rebinding guard (mlflow.server.fastapi_security), on since 3.14.
      # Default allowlist is localhost + private IPs by literal address, not
      # by hostname -- releases/mlflow-otel-collector.yaml calls this Service
      # by its cluster DNS name, so every export 403'd ("Rejected request
      # with invalid Host header") until this was added. port-forward access
      # (localhost/127.0.0.1) still needs its own entry once this is set --
      # passing --allowed-hosts replaces the default list, doesn't extend it.
      #
      # Every entry needs a bare form AND a ":*" form. is_allowed_host_header
      # (mlflow/server/security_utils.py) does `host == allowed` unless the
      # allowed entry itself contains "*", in which case it's fnmatch'd --
      # there is no automatic port-agnostic matching. The incoming Host
      # header always carries the port (":5000", non-default), so a bare
      # hostname with no ":*" companion never matches and still 403s --
      # confirmed live via the otel-collector's export logs still showing
      # "Rejected request with invalid Host header: mlflow-mlflow.mlflow.
      # svc.cluster.local:5000" after adding the bare hostname alone.
      value_options:
        allowed-hosts: "mlflow-mlflow.mlflow.svc.cluster.local,mlflow-mlflow.mlflow.svc.cluster.local:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    # kubectl port-forward -n mlflow svc/mlflow-mlflow 5000:5000
