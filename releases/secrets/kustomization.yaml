# SOPS-encrypted Secrets (see .sops.yaml, scripts/seal-secrets.sh). The
# releases Kustomization decrypts them on apply with flux-system/sops-age.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# xray-memory-*.sops.yaml are sealed but not applied while xray-memory.yaml
# is out of releases/kustomization.yaml (its server image is amd64-only and
# built from a private repo).
resources:
  - agentgateway-llm-secrets.sops.yaml
  - kagent-llm-key.sops.yaml
