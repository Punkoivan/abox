# SOPS-encrypted Secrets (see .sops.yaml, scripts/seal-secrets.sh). The
# releases Kustomization decrypts them on apply with flux-system/sops-age.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - xray-memory-auth.sops.yaml
  - xray-memory-snapshot-key.sops.yaml
  - agentgateway-llm-secrets.sops.yaml
  - kagent-llm-key.sops.yaml
