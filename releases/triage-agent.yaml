apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: triage-agent
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/den-vasyliev/abox/charts/triage-agent
  ref:
    tag: "0.21.0"
  # Private package, same as triage-core's OCIRepository -- see its comment
  # for why and the Secret-creation command. Same ghcr-credentials Secret.
  secretRef:
    name: ghcr-credentials
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: triage-agent
  namespace: triage
spec:
  interval: 1h
  releaseName: triage-agent
  dependsOn:
    - name: triage-core
  chartRef:
    kind: OCIRepository
    name: triage-agent
    namespace: flux-system
  install:
    createNamespace: true
  values:
    image:
      repository: ghcr.io/den-vasyliev/abox/triage-agent
      tag: v3.0.0-5933996-obi
    # Same reason as triage-core: the chart's own SA, not the namespace
    # default, so imagePullSecrets goes on the values, not just the SA patch.
    imagePullSecrets:
      - name: triage-ghcr-pull
    # push (the WebSocket link to triage-core) stays off until its token
    # Secret is prepared -- see releases/triage-core.yaml's clusterAgents.
