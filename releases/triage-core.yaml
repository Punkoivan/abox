apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: triage-core
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/den-vasyliev/abox/charts/triage-core
  ref:
    tag: "3.0.0"
  # Unlike this repo's other OCI charts, this package is private (a personal
  # GHCR package, not an org one -- ghcr.io/den-vasyliev/abox/charts/... has
  # never been made public). source-controller has no credentials by default,
  # so it 401s pulling the chart itself -- separate from, and before, any pod
  # ever needs an imagePullSecret. Secret is out-of-band cluster state, not in
  # this repo, created in flux-system before this OCIRepository reconciles:
  #
  #   kubectl -n flux-system create secret docker-registry ghcr-credentials \
  #     --docker-server=ghcr.io \
  #     --docker-username=<gh-username> \
  #     --docker-password="$(gh auth token)"
  secretRef:
    name: ghcr-credentials
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: triage-core
  namespace: triage
spec:
  interval: 1h
  releaseName: triage-core
  chartRef:
    kind: OCIRepository
    name: triage-core
    namespace: flux-system
  install:
    createNamespace: true
  values:
    image:
      repository: ghcr.io/den-vasyliev/abox/triage-core
      tag: sai-da8d1a7d
    # The chart's own serviceAccount.create renders a dedicated SA, not the
    # namespace default -- releases/triage.yaml's default-SA patch doesn't
    # cover it. imagePullSecrets here goes straight onto the pod spec.
    imagePullSecrets:
      - name: triage-ghcr-pull
    # No Vertex AI / Workload Identity on KinD -- the same baked llama.cpp +
    # nomic-embed-text-v1.5 sidecar releases/xray-memory.yaml and
    # releases/llama-cpp-embeddings.yaml already run, at the chart's default
    # image and settings.
    embedding:
      sidecar:
        enabled: true
    # Cluster-agent WS handshake. tokensSecret's data key (below) must equal
    # triage-agent's push.clusterName ("abox") -- both point at the same
    # triage-cluster-agent-tokens/triage-agent-push token value. Unverified:
    # the chart comment describes "<tenant>.<cluster>" pin keys but
    # triage-agent runs target.tenant: "" (cluster-mode); confirm the key
    # format against this controller's logs on first connect attempt.
    clusterAgents:
      enabled: true
      tokensSecret: triage-cluster-agent-tokens
    # Exposed through the ngrok tunnel already wired via
    # releases/ngrok-operator.yaml, onto agentgateway-external.
    httpRoute:
      enabled: true
      hostname: triageagent.ngrok.dev
      gatewayName: agentgateway-external
      gatewayNamespace: agentgateway-system
      sectionName: http
    # tokensSecret names an EXISTING Secret (unlike leaving auth empty, which
    # has the chart generate <fullname>-api-tokens itself) -- triage-api-tokens
    # already exists in-cluster, out-of-band.
    auth:
      tokensSecret: triage-api-tokens
    # No provider and no auth.token/tokensSecret would fail the whole HTTP API
    # closed (chart default). GitHub SSO's clientSecret comes from the
    # triage-github-oauth Secret (GITHUB_CLIENT_SECRET key), already in-cluster.
    sso:
      publicURL: https://triageagent.ngrok.dev
      github:
        clientId: Ov23li6QQzPWxk27mHpy
        secretRef:
          name: triage-github-oauth
          key: GITHUB_CLIENT_SECRET
    runtimeConfig:
      # Direct to Google, not through agentgateway-llm -- ag-llm v1.5.0 has a
      # confirmed bug routing an AI-Studio API key on the Gemini provider:
      # setup_request's x-goog-api-key relocation (agentgateway-llm.yaml's
      # comment on frontendPolicies.tracing has the old ag-llm-routed state;
      # this replaces it) runs before apply_backend_auth sets the
      # Authorization header, so the key goes out unrelocated and Google's
      # native generateContent endpoint 401s it ("Expected OAuth 2 access
      # token..."). Reproduced directly against
      # generativelanguage.googleapis.com with the real key -- not a key or
      # model-name problem.
      #
      # Gemini's own OpenAI-compatible endpoint takes the same API key as a
      # plain `Authorization: Bearer` -- confirmed working directly with curl
      # -- which is exactly the auth style GatewayModel (baseURL set) already
      # sends. So baseURL points straight at that endpoint instead of at
      # ag-llm; the API key is the real Gemini key here, not ag-llm's virtual
      # "triage" token, so it lives in its own Secret in this namespace:
      #   kubectl -n triage create secret generic triage-gemini-key \
      #     --from-literal=GEMINI_API_KEY=<gemini api key>
      # Read at agent start, so restart the pod after creating or rotating it.
      #
      # guardrailEnabled + the guardrail model turn on the LLM-based event
      # classifier (internal/core/guardrail.go's regex layer runs regardless,
      # this is the separate LLM classifier pass, GuardrailClassifierConfig).
      # rca is left unset: BuildRCA falls back to this guardrail model when
      # spec.RCAModel is nil (core/agent.go), so it isn't left on the Vertex
      # AI path that doesn't authenticate on KinD.
      models:
        main:
          baseURL: https://generativelanguage.googleapis.com/v1beta/openai
          name: gemini-2.5-flash
          apiKeySecretRef:
            name: triage-gemini-key
            key: GEMINI_API_KEY
        guardrailEnabled: true
        guardrail:
          baseURL: https://generativelanguage.googleapis.com/v1beta/openai
          name: gemini-2.5-flash
          apiKeySecretRef:
            name: triage-gemini-key
            key: GEMINI_API_KEY
      vectorStore:
        enabled: true
      eventSources:
        kubernetes:
          enabled: true
      # Off by default (runtimeConfig.otelTracing.enabled: false in the
      # chart) -- nothing exported triage-core's own LLM/guardrail/agent
      # spans anywhere until this. grpc is the only protocol the exporter
      # build supports; insecure: true because phoenix-svc has no TLS
      # (ClusterIP+NodePort, in-cluster only). projectName splits triage's
      # spans into their own Phoenix project instead of landing in the
      # default one every untenanted deployment shares.
      otelTracing:
        enabled: true
        endpoint: phoenix-svc.phoenix.svc.cluster.local:4317
        protocol: grpc
        insecure: true
        serviceName: triage-core
        projectName: triage-core
        samplePercent: 100
