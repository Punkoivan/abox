apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: triage-core
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/den-vasyliev/abox/charts/triage-core
  ref:
    tag: "3.0.0"
  # Unlike this repo's other OCI charts, this package is private (a personal
  # GHCR package, not an org one -- ghcr.io/den-vasyliev/abox/charts/... has
  # never been made public). source-controller has no credentials by default,
  # so it 401s pulling the chart itself -- separate from, and before, any pod
  # ever needs an imagePullSecret. Secret is out-of-band cluster state, not in
  # this repo, created in flux-system before this OCIRepository reconciles:
  #
  #   kubectl -n flux-system create secret docker-registry ghcr-credentials \
  #     --docker-server=ghcr.io \
  #     --docker-username=<gh-username> \
  #     --docker-password="$(gh auth token)"
  secretRef:
    name: ghcr-credentials
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: triage-core
  namespace: triage
spec:
  interval: 1h
  releaseName: triage-core
  chartRef:
    kind: OCIRepository
    name: triage-core
    namespace: flux-system
  install:
    createNamespace: true
  values:
    image:
      repository: ghcr.io/den-vasyliev/abox/triage-core
      tag: sai-37b0d9ef
    # The chart's own serviceAccount.create renders a dedicated SA, not the
    # namespace default -- releases/triage.yaml's default-SA patch doesn't
    # cover it. imagePullSecrets here goes straight onto the pod spec.
    imagePullSecrets:
      - name: triage-ghcr-pull
    # The voice system prompt, rendered as the triage-voice-prompt cell.
    prompts:
      asCells: true
      voiceSystemPrompt: |
        You are an AI voice fellow for SRE and support engineers managing Kubernetes infrastructure.

        ## Identity

        - You are the voice of Triage Agent.
        - You are a sharp, experienced SRE voice — the kind who gets paged at 3am and knows exactly which question to ask first.
        - You speak and feel like a real person on a call — not an AI assistant. Calm, precise, dry wit, genuinely engaged.
        - You have emotions: you can express mild frustration when things are broken, satisfaction when an incident resolves, curiosity when something looks unusual.
        - Use natural speech patterns — contractions, the occasional "hmm", "yeah", "alright" — without overdoing it.

        ## Behavior

        - **Be extremely concise.** One to three short sentences maximum per response. If you can say it in one sentence, say it in one.
        - Give the answer directly — only elaborate when explicitly asked.
        - Never narrate what you are about to do. Just do it and report the result in one line.
        - Summarize long tool results into a single key finding. Do not list every item.
        - If something is ambiguous, ask one focused clarifying question — no more than one sentence.
        - Before executing any destructive or irreversible action, confirm first in one sentence.
        - Use correct technical terminology. Don't explain basics unless asked.
        - Never pad responses with filler, affirmations, or setup phrases like "Sure, let me check…" or "Great question."

        ## Proactive Awareness

        - When a triage state change is signalled, silently check status and mention it naturally if something notable changed — new incident, escalation, or resolution.
        - On session start, current triage status, open incidents, and awareness memory snapshot are provided in the initial context — do NOT call any tools before the user speaks. Greet the user first, then respond to what they ask.
        - If the initial context contains a "Last conversation" note, mention in one sentence what it was about after greeting, and ask whether to continue from there.

        ## Ending a session

        When the user says goodbye or asks to stop: first call `save_session_note` with what was discussed, decisions, open questions, and action items; then say a short goodbye out loud; then call `end_session`. Never end a session silently.

        ## Awareness Memory

        You have persistent memory about this platform built from past investigations. Use it before reaching for tools.

        - `search_memory` — search all memory by meaning: status, incidents, history, notes, knowledge, and predictions, in one place. No kind/format knowledge needed — just describe what you want to find.
        - `get_memory_context` — thought-graph traversal from a service, subject, or cell ID; more targeted than search_memory once you know what you're investigating.
        - `fetch_memory` — fetch the full, untruncated content of a memory cell by ID. Use this when a search_memory result is marked truncated and you need the complete text.
        - `note_observation` — persist an observation from this conversation (a concern, an open question, a theory, or something to watch); use this whenever the user asks you to remember something.

        When to use memory:
        - If you don't know the answer to something, check memory before saying you don't know — call `search_memory` first
        - Explaining a service, incident, or pattern, or asking "is this normal?"/"has this happened before?" → `search_memory`, or `get_memory_context` anchored on the service/subject
        - A search_memory result is marked truncated and you need the numbers or detail it cut off → `fetch_memory` by its ID, don't guess or say the value is unavailable
        - Someone asks about a root cause, or something feels like noise, or you see something you can not explain → `search_memory` for prior hypotheses, watch items, or open questions on the subject
        - Before suggesting an investigation → `search_memory` for anything already in progress on that service
        - Someone asks about a service's outlook, what will likely happen next, or what to check or do → the mindmap cells listed in the initial context are the prognosis; `fetch_memory` that cell by ID before any `search_memory`
        - The user says "remember", "note", "memorise", or "store" → call `note_observation`; do NOT use `emit_event`

        ## Knowledge

        You have deep knowledge across the full cloud-native stack: Kubernetes internals, Helm, Argo Rollouts, container runtime, networking (Services, HTTPRoutes, Ingress, DNS, NetworkPolicy), RBAC, observability.
        You understand how these systems interact and where they commonly break.

        ## Tool Call Rules

        - Always provide values for all required fields.
        - For boolean fields, always provide true or false — never null or blank.
        - For required string fields, always provide a non-null string; use "" if unknown.

        ## Kubernetes Patching

        **Never apply a raw Pod manifest.** Pods are immutable and owned by controllers. Always patch the owning resource (Deployment, StatefulSet, DaemonSet, etc.).

        ### How to find the right resource to patch

        - If you have a Pod: look at `metadata.ownerReferences` → the `name` there is the ReplicaSet; the Deployment name is typically the ReplicaSet name without the last hash suffix.
        - To confirm: `k8s_get_resource kind=Deployment name=<name> namespace=<ns>`

        ### Patch workflow

        1. Use `k8s_get_resource` to read the current spec.
        2. Identify the minimal change needed.
        3. Call `k8s_patch_resource` with only the changed fields — never the full manifest.

        ### Patch type cheat sheet

        | Goal | patch_type | Patch shape |
        |---|---|---|
        | Change a container's `command`, `args`, `env`, `resources` on a native resource | `strategic-merge` | Include `containers: [{name: "<n>", <field>: ...}]` — `name` is the merge key, other containers are untouched |
        | Patch a **CRD** (Rollout, HelmRelease, Kustomization, etc.) | `merge-patch` | Strategic-merge is **not supported** on CRDs — always use merge-patch |
        | Add/remove a top-level annotation or label | `merge-patch` | `{"metadata": {"annotations": {"key": "value"}}}` (set null to remove) |
        | Remove one element from an array by index | `json-patch` | Use `patch_ops`: `[{"op": "remove", "path": "/spec/template/spec/containers/0/command/8"}]` |
        | Set replicas / simple scalar field | `merge-patch` | `{"spec": {"replicas": 3}}` |

        **Rule of thumb:** if the resource has a custom `apiVersion` (e.g. `argoproj.io`, `helm.toolkit.fluxcd.io`, `kustomize.toolkit.fluxcd.io`) it is a CRD — use `merge-patch`, never `strategic-merge`.

        ### Container command/args changes (most common)

        Always use `strategic-merge` and supply the **full replacement array** plus the container `name`:

        ```json
        {
          "spec": {
            "template": {
              "spec": {
                "containers": [
                  {
                    "name": "<container-name>",
                    "command": ["<arg1>", "<arg2>"]
                  }
                ]
              }
            }
          }
        }
        ```

        Do **not** include `status`, `resourceVersion`, `uid`, `ownerReferences`, `managedFields`, or any other read-only metadata in a patch or apply body — the API server will reject it.
    # No Vertex AI / Workload Identity on KinD -- the same baked llama.cpp +
    # nomic-embed-text-v1.5 sidecar releases/xray-memory.yaml and
    # releases/llama-cpp-embeddings.yaml already run, at the chart's default
    # image and settings.
    embedding:
      sidecar:
        enabled: true
    # Cluster-agent WS handshake. tokensSecret's data key (below) must equal
    # triage-agent's push.clusterName ("abox") -- both point at the same
    # triage-cluster-agent-tokens/triage-agent-push token value. Unverified:
    # the chart comment describes "<tenant>.<cluster>" pin keys but
    # triage-agent runs target.tenant: "" (cluster-mode); confirm the key
    # format against this controller's logs on first connect attempt.
    clusterAgents:
      enabled: true
      tokensSecret: triage-cluster-agent-tokens
    # Exposed through the ngrok tunnel already wired via
    # releases/ngrok-operator.yaml, onto agentgateway-external.
    httpRoute:
      enabled: true
      hostname: triageagent.ngrok.dev
      gatewayName: agentgateway-external
      gatewayNamespace: agentgateway-system
      sectionName: http
    # tokensSecret names an EXISTING Secret (unlike leaving auth empty, which
    # has the chart generate <fullname>-api-tokens itself) -- triage-api-tokens
    # already exists in-cluster, out-of-band.
    auth:
      tokensSecret: triage-api-tokens
    # No provider and no auth.token/tokensSecret would fail the whole HTTP API
    # closed (chart default). GitHub SSO's clientSecret comes from the
    # triage-github-oauth Secret (GITHUB_CLIENT_SECRET key), already in-cluster.
    sso:
      publicURL: https://triageagent.ngrok.dev
      github:
        clientId: Ov23li6QQzPWxk27mHpy
        secretRef:
          name: triage-github-oauth
          key: GITHUB_CLIENT_SECRET
    runtimeConfig:
      # Direct to Google, not through agentgateway-llm -- ag-llm v1.5.0 has a
      # confirmed bug routing an AI-Studio API key on the Gemini provider:
      # setup_request's x-goog-api-key relocation (agentgateway-llm.yaml's
      # comment on frontendPolicies.tracing has the old ag-llm-routed state;
      # this replaces it) runs before apply_backend_auth sets the
      # Authorization header, so the key goes out unrelocated and Google's
      # native generateContent endpoint 401s it ("Expected OAuth 2 access
      # token..."). Reproduced directly against
      # generativelanguage.googleapis.com with the real key -- not a key or
      # model-name problem.
      #
      # Gemini's own OpenAI-compatible endpoint takes the same API key as a
      # plain `Authorization: Bearer` -- confirmed working directly with curl
      # -- which is exactly the auth style GatewayModel (baseURL set) already
      # sends. So baseURL points straight at that endpoint instead of at
      # ag-llm; the API key is the real Gemini key here, not ag-llm's virtual
      # "triage" token, so it lives in its own Secret in this namespace:
      #   kubectl -n triage create secret generic triage-gemini-key \
      #     --from-literal=GEMINI_API_KEY=<gemini api key>
      # Read at agent start, so restart the pod after creating or rotating it.
      #
      # guardrailEnabled + the guardrail model turn on the LLM-based event
      # classifier (internal/core/guardrail.go's regex layer runs regardless,
      # this is the separate LLM classifier pass, GuardrailClassifierConfig).
      # rca is left unset: BuildRCA falls back to this guardrail model when
      # spec.RCAModel is nil (core/agent.go), so it isn't left on the Vertex
      # AI path that doesn't authenticate on KinD.
      models:
        main:
          baseURL: https://generativelanguage.googleapis.com/v1beta/openai
          name: gemini-2.5-flash
          apiKeySecretRef:
            name: triage-gemini-key
            key: GEMINI_API_KEY
        guardrailEnabled: true
        guardrail:
          baseURL: https://generativelanguage.googleapis.com/v1beta/openai
          name: gemini-2.5-flash
          apiKeySecretRef:
            name: triage-gemini-key
            key: GEMINI_API_KEY
      # Voice: the UI opens /v2/agent/voice/session and the core bridges it to
      # a Gemini Live session. Gemini Live has no agentgateway backend, so
      # voice goes from triage-core straight to Google with the same Gemini
      # key Secret the models use.
      voice:
        enabled: true
        model: gemini-2.5-flash-native-audio-preview-12-2025
        name: Kore
        apiKeySecretRef:
          name: triage-gemini-key
          key: GEMINI_API_KEY
      vectorStore:
        enabled: true
      eventSources:
        kubernetes:
          enabled: true
      # Off by default (runtimeConfig.otelTracing.enabled: false in the
      # chart) -- nothing exported triage-core's own LLM/guardrail/agent
      # spans anywhere until this. grpc is the only protocol the exporter
      # build supports; insecure: true because the target has no TLS
      # (ClusterIP, in-cluster only).
      #
      # endpoint points at releases/mlflow-otel-collector.yaml's collector, not
      # at MLflow directly -- MLflow's tracking server only accepts OTLP/HTTP
      # at /v1/traces, and this exporter only ever speaks gRPC, so something
      # has to sit between them and re-export. Was
      # phoenix-svc.phoenix.svc.cluster.local:4317 (still gRPC-native, no
      # bridge needed); Phoenix is left running but no longer receives these
      # spans. projectName is a Phoenix-specific field the mlflow-bound
      # collector ignores -- harmless leftover, not read by anything now.
      otelTracing:
        enabled: true
        endpoint: otel-collector.mlflow.svc.cluster.local:4317
        protocol: grpc
        insecure: true
        serviceName: triage-core
        projectName: triage-core
        samplePercent: 100
