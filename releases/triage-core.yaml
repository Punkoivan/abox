apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: triage-core
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/den-vasyliev/abox/charts/triage-core
  ref:
    tag: "3.0.0"
  # Unlike this repo's other OCI charts, this package is private (a personal
  # GHCR package, not an org one -- ghcr.io/den-vasyliev/abox/charts/... has
  # never been made public). source-controller has no credentials by default,
  # so it 401s pulling the chart itself -- separate from, and before, any pod
  # ever needs an imagePullSecret. Secret is out-of-band cluster state, not in
  # this repo, created in flux-system before this OCIRepository reconciles:
  #
  #   kubectl -n flux-system create secret docker-registry ghcr-credentials \
  #     --docker-server=ghcr.io \
  #     --docker-username=<gh-username> \
  #     --docker-password="$(gh auth token)"
  secretRef:
    name: ghcr-credentials
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: triage-core
  namespace: triage
spec:
  interval: 1h
  releaseName: triage-core
  chartRef:
    kind: OCIRepository
    name: triage-core
    namespace: flux-system
  install:
    createNamespace: true
  values:
    image:
      repository: ghcr.io/den-vasyliev/abox/triage-core
      tag: sai-753e7f0d
    # The chart's own serviceAccount.create renders a dedicated SA, not the
    # namespace default -- releases/triage.yaml's default-SA patch doesn't
    # cover it. imagePullSecrets here goes straight onto the pod spec.
    imagePullSecrets:
      - name: triage-ghcr-pull
    # No Vertex AI / Workload Identity on KinD -- the same baked llama.cpp +
    # nomic-embed-text-v1.5 sidecar releases/xray-memory.yaml and
    # releases/llama-cpp-embeddings.yaml already run, at the chart's default
    # image and settings.
    embedding:
      sidecar:
        enabled: true
