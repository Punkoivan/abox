# Namespace for Triage agent workloads. KinD needs a pull secret to fetch
# private ghcr.io images here, same as every other private image in this repo
# (see releases/xray-memory.yaml) -- pods 401 until it exists.
#
# The Secret itself is out-of-band cluster state, not in this repo, created
# before any pod in this namespace first schedules:
#
#   kubectl -n triage create secret docker-registry triage-ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=<gh-username> \
#     --docker-password="$(gh auth token)" \
#     --docker-email=<email>
#
# default is patched with imagePullSecrets so any pod that doesn't set its own
# serviceAccountName gets it for free. A Helm chart that creates its own
# ServiceAccount (serviceAccount.create: true) needs the same secret name
# added to its own imagePullSecrets value instead.
#
# triageagent.dev/tenant scopes this namespace's own workloads into the
# triage agent (cluster mode) as tenant "triage" -- same mechanism as
# opentelemetry-demo.yaml's otel-demo namespace, just watching the platform's
# own triage-core/triage-agent pods instead of a demo app. A namespace with no
# Tenant annotation is dropped rather than filed into a default (core's
# annotationkeys package).
apiVersion: v1
kind: Namespace
metadata:
  name: triage
  annotations:
    triageagent.dev/tenant: triage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: triage
imagePullSecrets:
  - name: triage-ghcr-pull
---
# flux-system's own Namespace object carries kustomize.toolkit.fluxcd.io/ssa:
# Ignore (set by the flux-operator bootstrap, alongside
# fluxcd.controlplane.io/prune: disabled and kustomize.toolkit.fluxcd.io/
# prune: Disabled) so nothing else fights the bootstrap over managing it.
#
# CONFIRMED (v0.11.14, live test): ssa: Ignore makes the releases
# Kustomization skip applying this object entirely, not just skip pruning
# it -- removing the annotation out of band and reconciling this file in did
# NOT bring it back. This block is therefore inert; it stays only as the
# documented intent. The actual mechanism is still the out-of-band command,
# same convention as every Secret in this repo:
#
#   kubectl annotate namespace flux-system triageagent.dev/tenant=triage --overwrite
#
# Re-run it if this annotation is ever missing (e.g. after a Codespace
# rebuild -- out-of-band cluster state doesn't survive one, see CLAUDE.md).
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  annotations:
    triageagent.dev/tenant: triage
